<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dynamic Pong Wars</title>
<meta name="description" content="A dynamic, customizable Pong Wars: two balls fight over territory. Pause, reset, recolor and retune everything live. No dependencies." />
<style>
  :root {
    --day: #fdfbf6;
    --night: #262b44;
    --surface: #14161f;
    --surface-2: #1d2030;
    --text: #f4f5f8;
    --muted: #a2a8bd;
    --line: rgba(255, 255, 255, 0.14);
    --on-top: #12141c;
    --on-top-muted: rgba(18, 20, 28, 0.66);
    --on-bottom: #f4f5f8;
    --on-bottom-muted: rgba(244, 245, 248, 0.7);
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    padding: clamp(16px, 3vw, 36px);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, var(--day) 0%, var(--night) 100%);
    background-attachment: fixed;
    transition: background 320ms ease;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 1120px;
    display: flex;
    flex-direction: column;
    gap: clamp(16px, 2.4vw, 26px);
  }

  header { text-align: center; }

  h1 {
    margin: 0;
    font-size: clamp(24px, 4.4vw, 40px);
    letter-spacing: -0.03em;
    color: var(--on-top);
  }

  .tagline {
    margin: 8px 0 0;
    font-size: 14px;
    color: var(--on-top-muted);
  }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: clamp(16px, 2.4vw, 26px);
    align-items: start;
  }

  .card {
    background: color-mix(in srgb, var(--surface) 86%, transparent);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.32);
    backdrop-filter: blur(10px);
  }

  .stage { padding: clamp(12px, 1.8vw, 20px); }

  .stage-inner {
    width: min(100%, 68vh);
    margin: 0 auto;
  }

  .scoreboard {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    font-variant-numeric: tabular-nums;
  }

  .team {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .team .swatch {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    border: 1px solid var(--line);
  }

  .team .count {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0;
  }

  .team.night { flex-direction: row-reverse; }

  .bar {
    position: relative;
    flex: 1;
    height: 8px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--night);
    border: 1px solid var(--line);
  }

  .bar span {
    position: absolute;
    inset: 0 auto 0 0;
    background: var(--day);
    transition: width 120ms linear;
  }

  .board-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    background: var(--night);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .board-wrap.paused::after {
    content: "Paused";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: clamp(18px, 3vw, 28px);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
    background: rgba(6, 8, 14, 0.52);
    backdrop-filter: blur(2px);
  }

  .panel {
    padding: clamp(14px, 1.8vw, 20px);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .panel h2 {
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .group { display: flex; flex-direction: column; gap: 10px; }

  .buttons { display: flex; gap: 8px; }

  button {
    flex: 1;
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    transition: transform 80ms ease, background 160ms ease, border-color 160ms ease;
  }

  button:hover { background: color-mix(in srgb, var(--surface-2) 70%, #fff); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--day); outline-offset: 2px; }

  button.primary {
    background: var(--day);
    color: #14161f;
    border-color: transparent;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 14px;
  }

  .row label { color: var(--muted); }
  .row .value { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }

  input[type="range"] {
    width: 100%;
    accent-color: var(--day);
    cursor: pointer;
  }

  input[type="color"] {
    width: 44px;
    height: 30px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
  }

  .presets { display: flex; flex-wrap: wrap; gap: 8px; }

  .preset {
    width: 34px;
    height: 34px;
    padding: 0;
    flex: 0 0 auto;
    border-radius: 9px;
    border: 1px solid var(--line);
    overflow: hidden;
    position: relative;
  }

  .preset:hover { background: none; }
  .preset i { position: absolute; top: 0; bottom: 0; width: 50%; }
  .preset i:first-child { left: 0; }
  .preset i:last-child { right: 0; }

  .hint {
    margin: 0;
    font-size: 12px;
    line-height: 1.6;
    color: var(--muted);
  }

  kbd {
    font: inherit;
    font-size: 11px;
    padding: 1px 5px;
    border-radius: 5px;
    background: var(--surface-2);
    border: 1px solid var(--line);
  }

  footer {
    text-align: center;
    font-size: 13px;
    color: var(--on-bottom-muted);
  }

  footer a { color: var(--on-bottom); }

  @media (max-width: 820px) {
    main { grid-template-columns: minmax(0, 1fr); }
  }

  @media (prefers-reduced-motion: reduce) {
    body, .bar span, button { transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Dynamic Pong Wars</h1>
    <p class="tagline">Two balls, one board, an endless turf war &mdash; recolor and retune it while it runs.</p>
  </header>

  <main>
    <section class="card stage">
      <div class="stage-inner">
      <div class="scoreboard">
        <div class="team day">
          <span class="swatch" id="swatchDay"></span>
          <span>Day</span>
          <span class="count" id="scoreDay">0</span>
        </div>
        <div class="bar"><span id="scoreBar"></span></div>
        <div class="team night">
          <span class="swatch" id="swatchNight"></span>
          <span>Night</span>
          <span class="count" id="scoreNight">0</span>
        </div>
      </div>

      <div class="board-wrap" id="boardWrap">
        <canvas id="board" width="800" height="800" aria-label="Pong Wars board"></canvas>
      </div>
      </div>
    </section>

    <aside class="card panel">
      <div class="group">
        <h2>Playback</h2>
        <div class="buttons">
          <button id="toggle" class="primary" type="button">Pause</button>
          <button id="reset" type="button">Reset</button>
        </div>
      </div>

      <div class="group">
        <h2>Colors</h2>
        <div class="row">
          <label for="dayColor">Day</label>
          <input type="color" id="dayColor" value="#fdfbf6" />
        </div>
        <div class="row">
          <label for="nightColor">Night</label>
          <input type="color" id="nightColor" value="#262b44" />
        </div>
        <div class="presets" id="presets"></div>
      </div>

      <div class="group">
        <h2>Physics</h2>
        <div class="row">
          <label for="speed">Speed</label>
          <span class="value" id="speedValue">1.0&times;</span>
        </div>
        <input type="range" id="speed" min="0.2" max="2.5" step="0.1" value="1" />

        <div class="row">
          <label for="grid">Grid</label>
          <span class="value" id="gridValue">32 &times; 32</span>
        </div>
        <input type="range" id="grid" min="12" max="64" step="4" value="32" />

        <div class="row">
          <label for="balls">Balls per side</label>
          <span class="value" id="ballsValue">1</span>
        </div>
        <input type="range" id="balls" min="1" max="4" step="1" value="1" />
      </div>

      <p class="hint">
        <kbd>Space</kbd> play/pause &middot; <kbd>R</kbd> reset &middot; <kbd>C</kbd> next palette
      </p>
    </aside>
  </main>

  <footer>
    Inspired by <a href="https://github.com/vnglst/pong-wars">Koen van Gilst&rsquo;s Pong Wars</a>. No dependencies &mdash; it&rsquo;s one HTML file.
  </footer>
</div>

<script>
(function () {
  "use strict";

  var SIZE = 800;              // logical board size in pixels
  var DAY = 0;
  var NIGHT = 1;

  var PALETTES = [
    ["#fdfbf6", "#262b44"],
    ["#f4d35e", "#0d3b66"],
    ["#ffd6e0", "#3d2c8d"],
    ["#c1f4c5", "#1b4332"],
    ["#ffe8d6", "#6b2737"],
    ["#e0fbfc", "#293241"]
  ];

  var canvas = document.getElementById("board");
  var ctx = canvas.getContext("2d");
  var boardWrap = document.getElementById("boardWrap");

  var ui = {
    toggle: document.getElementById("toggle"),
    reset: document.getElementById("reset"),
    dayColor: document.getElementById("dayColor"),
    nightColor: document.getElementById("nightColor"),
    presets: document.getElementById("presets"),
    speed: document.getElementById("speed"),
    speedValue: document.getElementById("speedValue"),
    grid: document.getElementById("grid"),
    gridValue: document.getElementById("gridValue"),
    balls: document.getElementById("balls"),
    ballsValue: document.getElementById("ballsValue"),
    scoreDay: document.getElementById("scoreDay"),
    scoreNight: document.getElementById("scoreNight"),
    scoreBar: document.getElementById("scoreBar"),
    swatchDay: document.getElementById("swatchDay"),
    swatchNight: document.getElementById("swatchNight")
  };

  var state = {
    n: 32,                     // squares per side
    square: SIZE / 32,
    speed: 1,
    perSide: 1,
    running: true,
    paletteIndex: 0,
    colors: ["#fdfbf6", "#262b44"],
    grid: null,
    balls: []
  };

  // ---------------------------------------------------------------- helpers

  function randomBetween(min, max) {
    return Math.random() * (max - min) + min;
  }

  function hexToRgb(hex) {
    var value = hex.replace("#", "");
    if (value.length === 3) {
      value = value[0] + value[0] + value[1] + value[1] + value[2] + value[2];
    }
    var int = parseInt(value, 16);
    return [(int >> 16) & 255, (int >> 8) & 255, int & 255];
  }

  function toHex(rgb) {
    return "#" + rgb.map(function (c) {
      return Math.round(Math.min(255, Math.max(0, c))).toString(16).padStart(2, "0");
    }).join("");
  }

  function mix(hexA, hexB, t) {
    var a = hexToRgb(hexA);
    var b = hexToRgb(hexB);
    return toHex([
      a[0] + (b[0] - a[0]) * t,
      a[1] + (b[1] - a[1]) * t,
      a[2] + (b[2] - a[2]) * t
    ]);
  }

  function luminance(hex) {
    var rgb = hexToRgb(hex).map(function (c) {
      var s = c / 255;
      return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
  }

  // The page chrome is derived from the two team colors, so recoloring the
  // board recolors the whole page — background, cards, text and all.
  function applyTheme() {
    var day = state.colors[DAY];
    var night = state.colors[NIGHT];
    var darker = luminance(day) < luminance(night) ? day : night;
    var surface = mix(darker, "#05060a", 0.62);
    var light = luminance(surface) > 0.4;
    var root = document.documentElement.style;

    root.setProperty("--day", day);
    root.setProperty("--night", night);
    root.setProperty("--surface", surface);
    root.setProperty("--surface-2", mix(surface, light ? "#000000" : "#ffffff", 0.12));
    root.setProperty("--text", light ? "#12141c" : "#f4f5f8");
    root.setProperty("--muted", light ? "rgba(18,20,28,0.62)" : "rgba(244,245,248,0.66)");
    root.setProperty("--line", light ? "rgba(0,0,0,0.16)" : "rgba(255,255,255,0.14)");

    // The gradient runs from the day color at the top to the night color at
    // the bottom, so the header and footer contrast against those, not the card.
    setOn(root, "top", day);
    setOn(root, "bottom", night);

    ui.swatchDay.style.background = day;
    ui.swatchNight.style.background = night;
    ui.dayColor.value = day;
    ui.nightColor.value = night;
  }

  function setOn(root, name, background) {
    var dark = luminance(background) > 0.45;
    root.setProperty("--on-" + name, dark ? "#12141c" : "#f4f5f8");
    root.setProperty("--on-" + name + "-muted", dark ? "rgba(18,20,28,0.66)" : "rgba(244,245,248,0.7)");
  }

  // ------------------------------------------------------------------ setup

  // Half a square per axis at 1x, i.e. the original's 45-degree diagonal step.
  function ballSpeed() {
    return state.square * 0.5 * Math.SQRT2 * state.speed;
  }

  function makeBall(team, index, total) {
    // Day balls start in the day half, night balls in the night half, spread
    // evenly down the board so extra balls do not overlap.
    var fraction = (index + 1) / (total + 1);
    var speed = ballSpeed();
    var angle = randomBetween(0, Math.PI * 2);
    var direction = team === DAY ? 1 : -1;

    return {
      team: team,
      x: team === DAY ? SIZE * 0.25 : SIZE * 0.75,
      y: SIZE * fraction,
      dx: Math.cos(angle) * speed * direction,
      dy: Math.sin(angle) * speed,
      r: state.square / 2
    };
  }

  function reset() {
    state.n = parseInt(ui.grid.value, 10);
    state.square = SIZE / state.n;
    state.speed = parseFloat(ui.speed.value);
    state.perSide = parseInt(ui.balls.value, 10);

    state.grid = new Uint8Array(state.n * state.n);
    for (var j = 0; j < state.n; j++) {
      for (var i = 0; i < state.n; i++) {
        state.grid[j * state.n + i] = i < state.n / 2 ? DAY : NIGHT;
      }
    }

    state.balls = [];
    for (var k = 0; k < state.perSide; k++) {
      state.balls.push(makeBall(DAY, k, state.perSide));
      state.balls.push(makeBall(NIGHT, k, state.perSide));
    }

    draw();
    updateScore();
  }

  // ------------------------------------------------------------------ logic

  // Sample eight points around the ball's circumference. Every square that
  // belongs to the other team is claimed, and each claim flips the ball on the
  // axis it was hit from. Two opposite hits in one frame cancel out, which is
  // what lets a ball occasionally punch a tunnel into enemy ground instead of
  // politely bouncing off a flat wall — that is where the churn comes from.
  function claimAndBounce(ball) {
    var n = state.n;
    var square = state.square;
    var jitter = state.square * 0.01;

    for (var angle = 0; angle < Math.PI * 2; angle += Math.PI / 4) {
      var checkX = ball.x + Math.cos(angle) * (ball.r + 1);
      var checkY = ball.y + Math.sin(angle) * (ball.r + 1);
      var i = Math.floor(checkX / square);
      var j = Math.floor(checkY / square);

      if (i < 0 || i >= n || j < 0 || j >= n) continue;

      var cell = j * n + i;
      if (state.grid[cell] === ball.team) continue;

      state.grid[cell] = ball.team;
      if (Math.abs(Math.cos(angle)) > Math.abs(Math.sin(angle))) {
        ball.dx = -ball.dx;
      } else {
        ball.dy = -ball.dy;
      }
      // A nudge on every hit keeps balls out of perfectly repeating orbits.
      ball.dx += randomBetween(-jitter, jitter);
      ball.dy += randomBetween(-jitter, jitter);
    }
  }

  function bounceOffWalls(ball) {
    if (ball.x + ball.dx > SIZE - ball.r || ball.x + ball.dx < ball.r) ball.dx = -ball.dx;
    if (ball.y + ball.dy > SIZE - ball.r || ball.y + ball.dy < ball.r) ball.dy = -ball.dy;
  }

  // Keep every ball at the configured speed and off the axes, so it can never
  // settle into a perfectly horizontal or vertical loop.
  function normalize(ball) {
    var target = ballSpeed();
    var floor = target * 0.18;

    if (Math.abs(ball.dx) < floor) ball.dx = (ball.dx < 0 ? -1 : 1) * floor;
    if (Math.abs(ball.dy) < floor) ball.dy = (ball.dy < 0 ? -1 : 1) * floor;

    var magnitude = Math.hypot(ball.dx, ball.dy) || 1;
    ball.dx = (ball.dx / magnitude) * target;
    ball.dy = (ball.dy / magnitude) * target;
    ball.r = state.square / 2;
  }

  function step() {
    for (var b = 0; b < state.balls.length; b++) {
      var ball = state.balls[b];
      claimAndBounce(ball);
      bounceOffWalls(ball);
      normalize(ball);
      ball.x = Math.min(SIZE - ball.r, Math.max(ball.r, ball.x + ball.dx));
      ball.y = Math.min(SIZE - ball.r, Math.max(ball.r, ball.y + ball.dy));
    }
  }

  // ---------------------------------------------------------------- drawing

  function draw() {
    var n = state.n;
    var square = state.square;

    for (var j = 0; j < n; j++) {
      for (var i = 0; i < n; i++) {
        ctx.fillStyle = state.colors[state.grid[j * n + i]];
        // Overdraw by a hair to avoid seams between squares.
        ctx.fillRect(i * square, j * square, square + 0.5, square + 0.5);
      }
    }

    for (var b = 0; b < state.balls.length; b++) {
      var ball = state.balls[b];
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      // A ball wears the other team's color, so it always contrasts with the
      // territory it is currently painting.
      ctx.fillStyle = state.colors[ball.team === DAY ? NIGHT : DAY];
      ctx.fill();
      ctx.closePath();
    }
  }

  function updateScore() {
    var day = 0;
    for (var c = 0; c < state.grid.length; c++) {
      if (state.grid[c] === DAY) day++;
    }
    var night = state.grid.length - day;

    ui.scoreDay.textContent = day;
    ui.scoreNight.textContent = night;
    ui.scoreBar.style.width = ((day / state.grid.length) * 100).toFixed(2) + "%";
  }

  var scoreTick = 0;

  function loop() {
    if (state.running) {
      step();
      draw();
      if (++scoreTick % 4 === 0) updateScore();
    }
    requestAnimationFrame(loop);
  }

  // ------------------------------------------------------------------- wire

  function setRunning(running) {
    state.running = running;
    ui.toggle.textContent = running ? "Pause" : "Play";
    boardWrap.classList.toggle("paused", !running);
  }

  function setPalette(index) {
    state.paletteIndex = (index + PALETTES.length) % PALETTES.length;
    state.colors = PALETTES[state.paletteIndex].slice();
    applyTheme();
    draw();
  }

  PALETTES.forEach(function (palette, index) {
    var button = document.createElement("button");
    button.type = "button";
    button.className = "preset";
    button.title = "Palette " + (index + 1);
    button.setAttribute("aria-label", "Palette " + (index + 1));
    button.innerHTML = '<i style="background:' + palette[0] + '"></i><i style="background:' + palette[1] + '"></i>';
    button.addEventListener("click", function () { setPalette(index); });
    ui.presets.appendChild(button);
  });

  ui.toggle.addEventListener("click", function () { setRunning(!state.running); });
  ui.reset.addEventListener("click", reset);

  ui.dayColor.addEventListener("input", function () {
    state.colors[DAY] = ui.dayColor.value;
    applyTheme();
    draw();
  });

  ui.nightColor.addEventListener("input", function () {
    state.colors[NIGHT] = ui.nightColor.value;
    applyTheme();
    draw();
  });

  // Speed retunes live; grid size and ball count change the board, so they
  // restart the round.
  ui.speed.addEventListener("input", function () {
    state.speed = parseFloat(ui.speed.value);
    ui.speedValue.innerHTML = state.speed.toFixed(1) + "&times;";
  });

  ui.grid.addEventListener("input", function () {
    ui.gridValue.innerHTML = ui.grid.value + " &times; " + ui.grid.value;
    reset();
  });

  ui.balls.addEventListener("input", function () {
    ui.ballsValue.textContent = ui.balls.value;
    reset();
  });

  document.addEventListener("keydown", function (event) {
    if (event.target instanceof HTMLInputElement) return;
    var key = event.key.toLowerCase();
    if (key === " " || event.code === "Space") {
      event.preventDefault();
      setRunning(!state.running);
    } else if (key === "r") {
      reset();
    } else if (key === "c") {
      setPalette(state.paletteIndex + 1);
    }
  });

  applyTheme();
  reset();
  setRunning(true);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
