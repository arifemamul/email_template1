<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dynamic Pong Wars</title>
<meta name="description" content="Pong Wars with live controls: two balls fight over the board while you retune colour, speed, grid and ball count." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" />
<style>
  :root {
    --day: #dbe7e3;
    --night: #24525f;
    --bg-top: #b4bcbb;
    --bg-bottom: #949fa0;
    --hud-text: #1d2a2d;
    --hud-muted: rgba(29, 42, 45, 0.6);
    --surface: #0e1a1e;
    --surface-2: #16262b;
    --text: #eef3f2;
    --muted: rgba(238, 243, 242, 0.66);
    --line: rgba(255, 255, 255, 0.16);
    --hud-h: 62px;
    --font-mono: "DM Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  html { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: var(--font-mono);
    color: var(--hud-text);
    background: linear-gradient(to bottom, var(--bg-top) 0%, var(--bg-top) 52%, var(--bg-bottom) 100%);
    transition: background 320ms ease;
    touch-action: manipulation;
    overflow: hidden;
  }

  /* Board and readout fill the viewport as one column: the board takes every
     pixel it can while staying square, the readout keeps a fixed strip. */
  .scene {
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100vh;
    height: 100dvh;
  }

  .board-area {
    flex: 0 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* The largest square that fits between the viewport width and the height
     left over by the readout. */
  .board-wrap {
    position: relative;
    line-height: 0;
    aspect-ratio: 1 / 1;
    width: min(100%, calc(100vh - var(--hud-h)));
    width: min(100%, calc(100dvh - var(--hud-h) - env(safe-area-inset-bottom, 0px)));
    max-height: 100%;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .board-wrap::after {
    content: "paused";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: clamp(15px, 3.4vw, 20px);
    letter-spacing: 0.22em;
    color: #fff;
    background: rgba(8, 14, 16, 0.5);
    opacity: 0;
    visibility: hidden;
    transition: opacity 180ms ease, visibility 180ms ease;
  }

  .board-wrap.paused::after { opacity: 1; visibility: visible; }

  .hud {
    flex: 0 0 auto;
    min-height: var(--hud-h);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    padding: 14px clamp(12px, 3vw, 22px);
    padding-bottom: max(14px, env(safe-area-inset-bottom));
  }

  .score {
    grid-column: 2;
    margin: 0;
    font-size: clamp(14px, 3.6vw, 17px);
    font-variant-numeric: tabular-nums;
    color: var(--hud-text);
    white-space: nowrap;
  }

  .hud-btn {
    grid-column: 3;
    justify-self: end;
    min-height: 34px;
    padding: 6px 12px;
    font: inherit;
    font-size: 13px;
    color: var(--hud-muted);
    background: transparent;
    border: 1px solid currentColor;
    border-radius: 999px;
    cursor: pointer;
    transition: color 160ms ease, background 160ms ease;
  }

  .hud-btn:hover { color: var(--hud-text); }
  .hud-btn:focus-visible { outline: 2px solid var(--hud-text); outline-offset: 3px; }

  /* Controls stay out of the way until asked for. */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(6, 12, 14, 0.42);
    opacity: 0;
    visibility: hidden;
    transition: opacity 240ms ease, visibility 240ms ease;
  }

  .backdrop.open { opacity: 1; visibility: visible; }

  .sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    margin: 0 auto;
    width: min(100%, 460px);
    max-height: 86vh;
    max-height: 86dvh;
    overflow-y: auto;
    padding: 20px clamp(16px, 4vw, 22px) max(20px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 18px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-bottom: 0;
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -18px 50px rgba(0, 0, 0, 0.4);
    transform: translateY(101%);
    visibility: hidden;
    transition: transform 280ms cubic-bezier(0.32, 0.72, 0, 1), visibility 280ms;
    -webkit-user-select: none;
    user-select: none;
  }

  .sheet.open { transform: none; visibility: visible; }

  .grip {
    width: 40px;
    height: 4px;
    margin: -6px auto 0;
    border-radius: 999px;
    background: var(--line);
  }

  .group { display: flex; flex-direction: column; gap: 10px; }

  .group h2 {
    margin: 0;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .buttons { display: flex; gap: 8px; }

  button.action {
    flex: 1;
    min-height: 44px;
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    transition: transform 80ms ease, background 160ms ease;
  }

  button.action:active { transform: translateY(1px); }
  button.action:focus-visible { outline: 2px solid var(--day); outline-offset: 2px; }

  button.action.primary {
    background: var(--day);
    color: #10191c;
    border-color: transparent;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 14px;
  }

  .row label { color: var(--muted); }
  .row .value { font-variant-numeric: tabular-nums; color: var(--text); }

  input[type="range"] {
    width: 100%;
    height: 28px;
    accent-color: var(--day);
    cursor: pointer;
  }

  input[type="color"] {
    width: 52px;
    height: 34px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
  }

  .presets { display: flex; flex-wrap: wrap; gap: 8px; }

  .preset {
    position: relative;
    width: 44px;
    height: 44px;
    padding: 0;
    flex: 0 0 auto;
    overflow: hidden;
    background: none;
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
  }

  .preset:focus-visible { outline: 2px solid var(--day); outline-offset: 2px; }
  .preset i { position: absolute; top: 0; bottom: 0; width: 50%; }
  .preset i:first-child { left: 0; }
  .preset i:last-child { right: 0; }

  .note {
    margin: 0;
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
  }

  .note a { color: var(--text); }

  kbd {
    font: inherit;
    font-size: 11px;
    padding: 1px 5px;
    border-radius: 5px;
    background: var(--surface-2);
    border: 1px solid var(--line);
  }

  .note-touch { display: none; }

  @media (hover: none) {
    .note-keys { display: none; }
    .note-touch { display: block; }
  }

  @media (prefers-reduced-motion: reduce) {
    body, .sheet, .backdrop, .board-wrap::after, button.action { transition: none; }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="board-area">
    <div class="board-wrap" id="boardWrap">
      <canvas id="board" width="800" height="800" aria-label="Pong Wars board"></canvas>
    </div>
  </div>
  <div class="hud">
    <p class="score" id="score">day 512 | night 512</p>
    <button type="button" class="hud-btn" id="sheetToggle" aria-expanded="false" aria-controls="sheet">controls</button>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="false" aria-label="Controls">
  <div class="grip"></div>

  <div class="group">
    <h2>Playback</h2>
    <div class="buttons">
      <button type="button" class="action primary" id="toggle">Pause</button>
      <button type="button" class="action" id="reset">Reset</button>
    </div>
  </div>

  <div class="group">
    <h2>Colours</h2>
    <div class="row">
      <label for="dayColor">Day</label>
      <input type="color" id="dayColor" value="#dbe7e3" />
    </div>
    <div class="row">
      <label for="nightColor">Night</label>
      <input type="color" id="nightColor" value="#24525f" />
    </div>
    <div class="presets" id="presets"></div>
  </div>

  <div class="group">
    <h2>Physics</h2>
    <div class="row">
      <label for="speed">Speed</label>
      <span class="value" id="speedValue">1.0&times;</span>
    </div>
    <input type="range" id="speed" min="0.2" max="2.5" step="0.1" value="1" />

    <div class="row">
      <label for="grid">Grid</label>
      <span class="value" id="gridValue">32 &times; 32</span>
    </div>
    <input type="range" id="grid" min="12" max="64" step="4" value="32" />

    <div class="row">
      <label for="balls">Balls per side</label>
      <span class="value" id="ballsValue">1</span>
    </div>
    <input type="range" id="balls" min="1" max="4" step="1" value="1" />
  </div>

  <p class="note note-keys">
    <kbd>Space</kbd> play/pause &middot; <kbd>R</kbd> reset &middot; <kbd>C</kbd> next palette &middot; <kbd>Esc</kbd> close
  </p>
  <p class="note note-touch">Tap the board to pause or resume.</p>
  <p class="note">Inspired by <a href="https://github.com/vnglst/pong-wars">Koen van Gilst&rsquo;s Pong Wars</a>.</p>
</div>

<script>
(function () {
  "use strict";

  var SIZE = 800;              // logical board size in pixels
  var DAY = 0;
  var NIGHT = 1;

  var PALETTES = [
    ["#dbe7e3", "#24525f"],
    ["#fdfbf6", "#262b44"],
    ["#f4d35e", "#0d3b66"],
    ["#ffd6e0", "#3d2c8d"],
    ["#c1f4c5", "#1b4332"],
    ["#ffe8d6", "#6b2737"]
  ];

  var canvas = document.getElementById("board");
  var ctx = canvas.getContext("2d");
  var boardWrap = document.getElementById("boardWrap");
  var sheet = document.getElementById("sheet");
  var backdrop = document.getElementById("backdrop");

  var ui = {
    score: document.getElementById("score"),
    sheetToggle: document.getElementById("sheetToggle"),
    toggle: document.getElementById("toggle"),
    reset: document.getElementById("reset"),
    dayColor: document.getElementById("dayColor"),
    nightColor: document.getElementById("nightColor"),
    presets: document.getElementById("presets"),
    speed: document.getElementById("speed"),
    speedValue: document.getElementById("speedValue"),
    grid: document.getElementById("grid"),
    gridValue: document.getElementById("gridValue"),
    balls: document.getElementById("balls"),
    ballsValue: document.getElementById("ballsValue")
  };

  var state = {
    n: 32,                     // squares per side
    square: SIZE / 32,
    speed: 1,
    perSide: 1,
    running: true,
    paletteIndex: 0,
    colors: PALETTES[0].slice(),
    grid: null,
    balls: []
  };

  // ---------------------------------------------------------------- helpers

  function randomBetween(min, max) {
    return Math.random() * (max - min) + min;
  }

  function hexToRgb(hex) {
    var value = hex.replace("#", "");
    if (value.length === 3) {
      value = value[0] + value[0] + value[1] + value[1] + value[2] + value[2];
    }
    var int = parseInt(value, 16);
    return [(int >> 16) & 255, (int >> 8) & 255, int & 255];
  }

  function toHex(rgb) {
    return "#" + rgb.map(function (c) {
      return Math.round(Math.min(255, Math.max(0, c))).toString(16).padStart(2, "0");
    }).join("");
  }

  function mix(hexA, hexB, t) {
    var a = hexToRgb(hexA);
    var b = hexToRgb(hexB);
    return toHex([
      a[0] + (b[0] - a[0]) * t,
      a[1] + (b[1] - a[1]) * t,
      a[2] + (b[2] - a[2]) * t
    ]);
  }

  function luminance(hex) {
    var rgb = hexToRgb(hex).map(function (c) {
      var s = c / 255;
      return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
  }

  // Everything off the board — page gradient, sheet, readout — is derived from
  // the two team colours, so recolouring the board recolours the page.
  function applyTheme() {
    var day = state.colors[DAY];
    var night = state.colors[NIGHT];
    var darker = luminance(day) < luminance(night) ? day : night;
    var surface = mix(darker, "#05080a", 0.55);
    var lightSurface = luminance(surface) > 0.4;
    var bgBottom = mix(night, "#d3d8d8", 0.66);
    var root = document.documentElement.style;

    root.setProperty("--day", day);
    root.setProperty("--night", night);
    root.setProperty("--bg-top", mix(day, "#9aa2a2", 0.45));
    root.setProperty("--bg-bottom", bgBottom);
    root.setProperty("--surface", surface);
    root.setProperty("--surface-2", mix(surface, lightSurface ? "#000000" : "#ffffff", 0.12));
    root.setProperty("--text", lightSurface ? "#10191c" : "#eef3f2");
    root.setProperty("--muted", lightSurface ? "rgba(16,25,28,0.62)" : "rgba(238,243,242,0.66)");
    root.setProperty("--line", lightSurface ? "rgba(0,0,0,0.16)" : "rgba(255,255,255,0.16)");

    // The readout sits on the bottom of the gradient, so it takes its contrast
    // from there rather than from the sheet.
    var darkOnBottom = luminance(bgBottom) > 0.42;
    root.setProperty("--hud-text", darkOnBottom ? "#1d2a2d" : "#eef3f2");
    root.setProperty("--hud-muted", darkOnBottom ? "rgba(29,42,45,0.6)" : "rgba(238,243,242,0.66)");

    ui.dayColor.value = day;
    ui.nightColor.value = night;
  }

  // ------------------------------------------------------------------ setup

  // Half a square per axis at 1x, i.e. the original's 45-degree diagonal step.
  function ballSpeed() {
    return state.square * 0.5 * Math.SQRT2 * state.speed;
  }

  function makeBall(team, index, total) {
    // Day balls start in the day half, night balls in the night half, spread
    // evenly down the board so extra balls do not overlap.
    var fraction = (index + 1) / (total + 1);
    var speed = ballSpeed();
    var angle = randomBetween(0, Math.PI * 2);
    var direction = team === DAY ? 1 : -1;

    return {
      team: team,
      x: team === DAY ? SIZE * 0.25 : SIZE * 0.75,
      y: SIZE * fraction,
      dx: Math.cos(angle) * speed * direction,
      dy: Math.sin(angle) * speed,
      r: state.square / 2
    };
  }

  function reset() {
    state.n = parseInt(ui.grid.value, 10);
    state.square = SIZE / state.n;
    state.speed = parseFloat(ui.speed.value);
    state.perSide = parseInt(ui.balls.value, 10);

    state.grid = new Uint8Array(state.n * state.n);
    for (var j = 0; j < state.n; j++) {
      for (var i = 0; i < state.n; i++) {
        state.grid[j * state.n + i] = i < state.n / 2 ? DAY : NIGHT;
      }
    }

    state.balls = [];
    for (var k = 0; k < state.perSide; k++) {
      state.balls.push(makeBall(DAY, k, state.perSide));
      state.balls.push(makeBall(NIGHT, k, state.perSide));
    }

    draw();
    updateScore();
  }

  // ------------------------------------------------------------------ logic

  // Sample eight points around the ball's circumference. Every square that
  // belongs to the other team is claimed, and each claim flips the ball on the
  // axis it was hit from. Two opposite hits in one frame cancel out, which is
  // what lets a ball occasionally punch a tunnel into enemy ground instead of
  // politely bouncing off a flat wall — that is where the churn comes from.
  function claimAndBounce(ball) {
    var n = state.n;
    var square = state.square;
    var jitter = state.square * 0.01;

    for (var angle = 0; angle < Math.PI * 2; angle += Math.PI / 4) {
      var checkX = ball.x + Math.cos(angle) * (ball.r + 1);
      var checkY = ball.y + Math.sin(angle) * (ball.r + 1);
      var i = Math.floor(checkX / square);
      var j = Math.floor(checkY / square);

      if (i < 0 || i >= n || j < 0 || j >= n) continue;

      var cell = j * n + i;
      if (state.grid[cell] === ball.team) continue;

      state.grid[cell] = ball.team;
      if (Math.abs(Math.cos(angle)) > Math.abs(Math.sin(angle))) {
        ball.dx = -ball.dx;
      } else {
        ball.dy = -ball.dy;
      }
      // A nudge on every hit keeps balls out of perfectly repeating orbits.
      ball.dx += randomBetween(-jitter, jitter);
      ball.dy += randomBetween(-jitter, jitter);
    }
  }

  function bounceOffWalls(ball) {
    if (ball.x + ball.dx > SIZE - ball.r || ball.x + ball.dx < ball.r) ball.dx = -ball.dx;
    if (ball.y + ball.dy > SIZE - ball.r || ball.y + ball.dy < ball.r) ball.dy = -ball.dy;
  }

  // Keep every ball at the configured speed and off the axes, so it can never
  // settle into a perfectly horizontal or vertical loop.
  function normalize(ball) {
    var target = ballSpeed();
    var floor = target * 0.18;

    if (Math.abs(ball.dx) < floor) ball.dx = (ball.dx < 0 ? -1 : 1) * floor;
    if (Math.abs(ball.dy) < floor) ball.dy = (ball.dy < 0 ? -1 : 1) * floor;

    var magnitude = Math.hypot(ball.dx, ball.dy) || 1;
    ball.dx = (ball.dx / magnitude) * target;
    ball.dy = (ball.dy / magnitude) * target;
    ball.r = state.square / 2;
  }

  function step() {
    for (var b = 0; b < state.balls.length; b++) {
      var ball = state.balls[b];
      claimAndBounce(ball);
      bounceOffWalls(ball);
      normalize(ball);
      ball.x = Math.min(SIZE - ball.r, Math.max(ball.r, ball.x + ball.dx));
      ball.y = Math.min(SIZE - ball.r, Math.max(ball.r, ball.y + ball.dy));
    }
  }

  // ---------------------------------------------------------------- drawing

  function draw() {
    var n = state.n;
    var square = state.square;
    // The game thinks in an 800-unit space; the canvas may be any size, so
    // scale on the way out. Cell edges are rounded to whole device pixels and
    // shared between neighbours, which is what keeps the grid seam-free at
    // fractional scales instead of leaving hairlines between squares.
    var scale = canvas.width / SIZE;

    for (var j = 0; j < n; j++) {
      var top = Math.round(j * square * scale);
      var bottom = Math.round((j + 1) * square * scale);
      for (var i = 0; i < n; i++) {
        var left = Math.round(i * square * scale);
        var right = Math.round((i + 1) * square * scale);
        ctx.fillStyle = state.colors[state.grid[j * n + i]];
        ctx.fillRect(left, top, right - left, bottom - top);
      }
    }

    for (var b = 0; b < state.balls.length; b++) {
      var ball = state.balls[b];
      ctx.beginPath();
      ctx.arc(ball.x * scale, ball.y * scale, ball.r * scale, 0, Math.PI * 2);
      // A ball wears the other team's color, so it always contrasts with the
      // territory it is currently painting.
      ctx.fillStyle = state.colors[ball.team === DAY ? NIGHT : DAY];
      ctx.fill();
      ctx.closePath();
    }
  }

  function resizeCanvas() {
    var displayed = canvas.getBoundingClientRect().width;
    if (!displayed) return;

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var pixels = Math.max(1, Math.round(displayed * dpr));

    if (canvas.width !== pixels) {
      canvas.width = pixels;
      canvas.height = pixels;
    }
    draw();
  }

  function updateScore() {
    var day = 0;
    for (var c = 0; c < state.grid.length; c++) {
      if (state.grid[c] === DAY) day++;
    }
    ui.score.textContent = "day " + day + " | night " + (state.grid.length - day);
  }

  var scoreTick = 0;

  function loop() {
    if (state.running) {
      step();
      draw();
      if (++scoreTick % 4 === 0) updateScore();
    }
    requestAnimationFrame(loop);
  }

  // ------------------------------------------------------------------- wire

  function setRunning(running) {
    state.running = running;
    ui.toggle.textContent = running ? "Pause" : "Play";
    boardWrap.classList.toggle("paused", !running);
  }

  function setSheet(open) {
    sheet.classList.toggle("open", open);
    backdrop.classList.toggle("open", open);
    ui.sheetToggle.setAttribute("aria-expanded", open ? "true" : "false");
    ui.sheetToggle.textContent = open ? "close" : "controls";
  }

  function setPalette(index) {
    state.paletteIndex = (index + PALETTES.length) % PALETTES.length;
    state.colors = PALETTES[state.paletteIndex].slice();
    applyTheme();
    draw();
  }

  PALETTES.forEach(function (palette, index) {
    var button = document.createElement("button");
    button.type = "button";
    button.className = "preset";
    button.title = "Palette " + (index + 1);
    button.setAttribute("aria-label", "Palette " + (index + 1));
    button.innerHTML = '<i style="background:' + palette[0] + '"></i><i style="background:' + palette[1] + '"></i>';
    button.addEventListener("click", function () { setPalette(index); });
    ui.presets.appendChild(button);
  });

  ui.toggle.addEventListener("click", function () { setRunning(!state.running); });
  ui.reset.addEventListener("click", reset);
  ui.sheetToggle.addEventListener("click", function () {
    setSheet(!sheet.classList.contains("open"));
  });
  backdrop.addEventListener("click", function () { setSheet(false); });

  // The board itself is the play/pause control on touch, where there is no
  // keyboard and the controls sit behind a sheet.
  boardWrap.addEventListener("click", function () { setRunning(!state.running); });

  ui.dayColor.addEventListener("input", function () {
    state.colors[DAY] = ui.dayColor.value;
    applyTheme();
    draw();
  });

  ui.nightColor.addEventListener("input", function () {
    state.colors[NIGHT] = ui.nightColor.value;
    applyTheme();
    draw();
  });

  // Speed retunes live; grid size and ball count change the board, so they
  // restart the round.
  ui.speed.addEventListener("input", function () {
    state.speed = parseFloat(ui.speed.value);
    ui.speedValue.innerHTML = state.speed.toFixed(1) + "&times;";
  });

  ui.grid.addEventListener("input", function () {
    ui.gridValue.innerHTML = ui.grid.value + " &times; " + ui.grid.value;
    reset();
  });

  ui.balls.addEventListener("input", function () {
    ui.ballsValue.textContent = ui.balls.value;
    reset();
  });

  document.addEventListener("keydown", function (event) {
    if (event.target instanceof HTMLInputElement) return;
    var key = event.key.toLowerCase();
    if (key === " " || event.code === "Space") {
      event.preventDefault();
      setRunning(!state.running);
    } else if (key === "r") {
      reset();
    } else if (key === "c") {
      setPalette(state.paletteIndex + 1);
    } else if (key === "escape") {
      setSheet(false);
    }
  });

  window.addEventListener("resize", resizeCanvas);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resizeCanvas);

  applyTheme();
  reset();
  resizeCanvas();
  setRunning(true);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
